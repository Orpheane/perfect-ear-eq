<text x="45" y="163" fill="#f6f3ff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="69" letter-spacing="-3">PERFECT EAR</text>
<text x="45" y="241" fill="url(#g)" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="83" letter-spacing="-3">EQ</text>
<text x="48" y="298" fill="#d9d7ed" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500">Your sound. Your way.</text>
