<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Perfect Ear EQ — Make Every Tab Sound Better</title>
<desc id="desc">Promotional artwork for the Perfect Ear EQ Chrome extension, featuring an equalizer-inspired graphic and the phrase Your sound, your way. This is not a screenshot of the extension.</desc>
