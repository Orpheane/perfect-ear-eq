<linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#5168d7"/><stop offset=".5" stop-color="#9c83ff"/><stop offset="1" stop-color="#d6b1ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".34"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
